[mypy]
python_version = 3.12
# Resolve the sibling repos Oracle imports at runtime (relative = portable).
mypy_path = ../tools/omnicli, ../invisible-seam/src, ../Scan4Me

[mypy-playwright.*]
ignore_missing_imports = True
[mypy-crawl4ai.*]
ignore_missing_imports = True
[mypy-websocket.*]
ignore_missing_imports = True
[mypy-webpipe.*]
ignore_missing_imports = True

# Gate scope: Oracle's own files only. Sibling repos are checked in their
# own phases; skip their internals here (imports still resolve).
[mypy-omnicli.*]
follow_imports = skip
ignore_errors = True
[mypy-invisible_seam.*]
follow_imports = skip
ignore_errors = True
[mypy-scan4me.*]
follow_imports = skip
ignore_errors = True
